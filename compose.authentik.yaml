services:
  postgresql:
    image: docker.io/library/postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD required}
      POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
    volumes:
      - authentik_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 15s
      retries: 5
      timeout: 5s
    networks:
      - hub_sso_internal

  redis:
    image: docker.io/library/redis:${REDIS_VERSION:-7-alpine}
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - authentik_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -Fxq PONG"]
      start_period: 10s
      interval: 15s
      retries: 5
      timeout: 5s
    networks:
      - hub_sso_internal

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.2.1}
    command: server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY required}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.org}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - "${AUTHENTIK_BLUEPRINT_FILE:-./state/rendered/oscar-federation.yaml}:/blueprints/custom/oscar-federation.yaml:ro"
    ports:
      - "${AUTHENTIK_BIND_ADDRESS:-127.0.0.1}:${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "${AUTHENTIK_BIND_ADDRESS:-127.0.0.1}:${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 45s
      interval: 20s
      retries: 5
      timeout: 10s
    networks:
      - hub_sso_internal

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.2.1}
    command: worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY required}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.org}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
      - "${AUTHENTIK_BLUEPRINT_FILE:-./state/rendered/oscar-federation.yaml}:/blueprints/custom/oscar-federation.yaml:ro"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 45s
      interval: 20s
      retries: 5
      timeout: 10s
    networks:
      - hub_sso_internal

volumes:
  authentik_database:
  authentik_redis:
  authentik_media:
  authentik_certs:
  authentik_templates:

networks:
  hub_sso_internal:
    driver: bridge
